<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IR Speed Tracker</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #16181d; --muted: #6b7280;
    --border: #e3e5ea; --accent: #2563eb; --ok: #16a34a; --bad: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #181b21; --text: #eef0f3; --muted: #9aa1ad;
      --border: #2a2e37; --accent: #60a5fa; --ok: #4ade80; --bad: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); }
  .dot.live { background: var(--ok); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .hero { text-align: center; padding: 36px 20px; transition: box-shadow .3s; }
  .hero.flash { box-shadow: 0 0 0 3px var(--accent); }
  .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .05em; }
  .speed { font-size: clamp(64px, 16vw, 112px); font-weight: 700; line-height: 1; margin: 12px 0 4px;
           font-variant-numeric: tabular-nums; }
  .unit { font-size: 24px; color: var(--muted); font-weight: 500; }
  .sub { color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 12px 0; }
  .stat .value { font-size: 26px; font-weight: 650; margin-top: 4px; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  tr:last-child td { border-bottom: none; }
  .empty { color: var(--muted); text-align: center; padding: 16px; }
  @media (max-width: 520px) {
    .stats { grid-template-columns: 1fr; }
    .hide-sm { display: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>IR Speed Tracker</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Connecting…</span></div>
  </header>

  <section class="card hero" id="hero">
    <div class="label">Last car</div>
    <div class="speed"><span id="speed">—</span> <span class="unit">km/h</span></div>
    <div class="sub" id="detail">Waiting for the first car…</div>
  </section>

  <section class="stats">
    <div class="card stat"><div class="label">Cars counted</div><div class="value" id="count">0</div></div>
    <div class="card stat"><div class="label">Top speed</div><div class="value" id="top">—</div></div>
    <div class="card stat"><div class="label">Average speed</div><div class="value" id="avg">—</div></div>
  </section>

  <section class="card">
    <div class="label" style="margin-bottom:8px">Recent readings</div>
    <table>
      <thead><tr><th>#</th><th class="hide-sm">Time</th><th>Gate time</th><th>m/s</th><th>km/h</th></tr></thead>
      <tbody id="rows"><tr><td colspan="5" class="empty">No readings yet</td></tr></tbody>
    </table>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let lastId = null;

  function ago(iso) {
    const s = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000));
    if (s < 60) return s + "s ago";
    if (s < 3600) return Math.round(s / 60) + " min ago";
    return new Date(iso).toLocaleString();
  }

  function render(data) {
    const list = data.readings;
    $("count").textContent = data.count;
    if (!list.length) return;

    const latest = list[list.length - 1];
    $("speed").textContent = latest.speed_kmh.toFixed(1);
    $("detail").textContent =
      `${latest.speed_mps.toFixed(2)} m/s · ${latest.time_s.toFixed(4)} s through the gate · ${ago(latest.received_at)}`;

    const speeds = list.map(r => r.speed_kmh);
    $("top").textContent = Math.max(...speeds).toFixed(1) + " km/h";
    $("avg").textContent = (speeds.reduce((a, b) => a + b, 0) / speeds.length).toFixed(1) + " km/h";

    $("rows").innerHTML = list.slice(-20).reverse().map(r => `
      <tr>
        <td>${r.id}</td>
        <td class="hide-sm">${new Date(r.received_at).toLocaleTimeString()}</td>
        <td>${r.time_s.toFixed(4)} s</td>
        <td>${r.speed_mps.toFixed(2)}</td>
        <td>${r.speed_kmh.toFixed(1)}</td>
      </tr>`).join("");

    if (lastId !== null && latest.id !== lastId) {
      $("hero").classList.add("flash");
      setTimeout(() => $("hero").classList.remove("flash"), 600);
    }
    lastId = latest.id;
  }

  async function poll() {
    try {
      const res = await fetch("/api/readings", { cache: "no-store" });
      render(await res.json());
      $("dot").classList.add("live");
      $("status").textContent = "Live";
    } catch {
      $("dot").classList.remove("live");
      $("status").textContent = "Server unreachable";
    }
  }

  poll();
  setInterval(poll, 1000);
</script>
</body>
</html>
